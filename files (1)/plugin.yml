name: NationWar
version: 3.0.0
main: com.nationwar.NationWarPlugin
api-version: "26.2"
description: 국가 전쟁 서버용 플러그인
commands:
  국가:
    description: 국가 명령어 (관리자가 허용한 명령어만 일반 유저 사용 가능)
    aliases: [나라]
    usage: /국가 도움말
  국가관리:
    description: 국가 관리자 명령어
    usage: /국가관리 <리로드|구역설정|돈지급|해체|명령어|명령어목록>
permissions:
  nationwar.admin:
    description: 관리자 명령어
    default: op
  nationwar.bypass:
    description: 영토 보호 무시
    default: op
