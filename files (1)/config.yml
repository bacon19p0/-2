# ===== 플레이 가능 구역 =====
# 월드 스폰을 중심으로 size-blocks x size-blocks (기본 1만 x 1만) 안에서만 땅을 살 수 있습니다.
# 중심 좌표(center-x, center-z)는 최초 실행 시 스폰 위치로 자동 저장됩니다.
region:
  world: ""              # 비워두면 첫 번째 월드(보통 world)
  size-blocks: 10000
  apply-world-border: true

# ===== 돈 =====
economy:
  start-balance: 0
  price-per-block: 10         # 땅 1블록(위에서 봤을 때 보이는 1칸)당 가격
  nation-create-price: 0      # 건국 추가 비용 (땅 가격 별도)

# ===== 땅 구매 규칙 =====
claims:
  require-near: true            # 확장 시 기존 땅에서 max-gap-chunks 이내여야 함 (맞닿을 필요는 없음)
  max-gap-chunks: 3
  max-area-per-purchase: 10000  # 한 번에 살 수 있는 최대 면적(블록)
  max-area-per-nation: 250000   # 국가 전체 최대 면적(블록)

# ===== 상점 =====
shop:
  magnet-pickaxe-price: 2000
  # 판매 가격 (1개당 원). 순서대로 판매 탭에 표시됩니다. 광석 / 구워지기 전 / 구워진 후
  sell:
    COAL_ORE: 6
    DEEPSLATE_COAL_ORE: 6
    COAL: 5
    COPPER_ORE: 10
    DEEPSLATE_COPPER_ORE: 10
    RAW_COPPER: 6
    COPPER_INGOT: 8
    IRON_ORE: 20
    DEEPSLATE_IRON_ORE: 20
    RAW_IRON: 12
    IRON_INGOT: 16
    GOLD_ORE: 40
    DEEPSLATE_GOLD_ORE: 40
    NETHER_GOLD_ORE: 20
    RAW_GOLD: 25
    GOLD_INGOT: 32
    LAPIS_ORE: 20
    DEEPSLATE_LAPIS_ORE: 20
    LAPIS_LAZULI: 6
    REDSTONE_ORE: 20
    DEEPSLATE_REDSTONE_ORE: 20
    REDSTONE: 5
    NETHER_QUARTZ_ORE: 15
    QUARTZ: 8
    DIAMOND_ORE: 150
    DEEPSLATE_DIAMOND_ORE: 150
    DIAMOND: 100
    EMERALD_ORE: 100
    DEEPSLATE_EMERALD_ORE: 100
    EMERALD: 70
    ANCIENT_DEBRIS: 400
    NETHERITE_SCRAP: 350
    NETHERITE_INGOT: 1500

war:
  require-defender-online: true   # 상대 시민이 한 명도 없으면 선전포고/침범/파괴/정복 불가
  declarer-glow-seconds: 10       # 선전포고한 사람만 발광
  spectator-seconds: 3
  conquest-lock-minutes: 10
  peace-request-expire-seconds: 120
  flag-range: 24                  # 깃발 사용 시 상대 땅까지 최대 거리(블록)
  consume-flags: true

pass:
  duration-seconds: 120
  default-toll: 0

protection:
  protect-explosions: true

# ===== 일반 유저가 쓸 수 있는 /국가 하위 명령어 =====
# 기본은 전부 false(관리자 전용). 관리자는 /국가관리 명령어 <이름|전체> <허용|금지> 로 바꿉니다.
# (상태창 Shift+우클릭 / Shift+F 는 명령어가 아니라서 항상 모두 사용 가능)
player-commands:
  건국: false
  땅포기: false
  초대: false
  수락: false
  추방: false
  해체: false
  정보: false
  목록: false
  전쟁: false
  휴전: false
  잔액: false
  상태: false
  규칙: false

rules:
  - "리소스팩은 자유롭게 사용 가능 (단, 서버 규칙에 어긋나거나 기본적으로 허용되지 않는 것은 금지)"
  - "핵(부정 프로그램) 사용 금지"
  - "사기 금지"
  - "상대가 오프라인일 때 상대 영역 침범 및 파괴 금지 (플러그인이 자동으로 막습니다)"
